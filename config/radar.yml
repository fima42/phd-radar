  - {name: Gebiedsontwikkeling.nu, url: "https://www.gebiedsontwikkeling.nu/rss", color: "#00A6D6"}
  - {name: Cobouw, url: "https://www.cobouw.nl/rss", color: "#E8742B"}
  - {name: Stadszaken, url: "https://www.stadszaken.nl/rss", color: "#6fbf8e"}
  - {name: ROmagazine, url: "https://www.romagazine.nl/rss", color: "#a28ae5"}
  - {name: Duurzaam Gebouwd, url: "https://www.duurzaamgebouwd.nl/rss", color: "#5FD4E8"}
